<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f3e9">
  <title>海风骑行俱乐部 · 鹈鹕的好天气</title>
  <style>
    :root { color-scheme: light; --paper:#f5f3e9; --ink:#283e38; --muted:#738178; --green:#326d5b; --line:#d9dfd1; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    button,input { font:inherit; }
    button { -webkit-tap-highlight-color:transparent; }
    .page { max-width:1240px; margin:0 auto; padding:30px 42px 23px; }
    .masthead { display:flex; align-items:center; justify-content:space-between; gap:20px; padding-bottom:22px; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:11px; }
    .brand-mark { width:38px; height:38px; }
    .brand-name { font-weight:750; font-size:14px; letter-spacing:.08em; }
    .brand-en { display:block; font-size:9px; letter-spacing:.23em; font-weight:500; margin-top:4px; color:var(--muted); }
    .edition { font-size:10px; letter-spacing:.14em; display:flex; align-items:center; gap:18px; color:var(--muted); }
    .edition span:first-child { border:1px solid #cbd5c8; border-radius:5px; padding:6px 8px; color:var(--green); }
    .intro { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; padding:31px 0 27px; }
    .eyebrow { color:var(--green); letter-spacing:.24em; font-size:10px; font-weight:650; margin:0 0 12px; }
    h1 { font-size:clamp(25px,3.2vw,38px); letter-spacing:.035em; line-height:1.35; font-weight:650; margin:0 0 11px; }
    .subtitle { color:var(--muted); font-size:13px; margin:0; letter-spacing:.04em; line-height:1.8; }
    .live { flex-shrink:0; display:flex; align-items:center; gap:8px; font-size:10px; color:var(--green); letter-spacing:.1em; padding-bottom:4px; }
    .live-dot { width:6px; height:6px; border-radius:50%; background:#6c9874; box-shadow:0 0 0 4px #6c987410; }
    .paused .live-dot { background:#b5a06c; box-shadow:0 0 0 4px #b5a06c12; }
    .scene-card { border:1px solid #d4ddcd; border-radius:20px; overflow:hidden; background:#fbfaf3; box-shadow:0 9px 26px #3e574408; }
    .scene-wrap { position:relative; overflow:hidden; background:#e7efe2; }
    .scene { display:block; width:100%; height:auto; aspect-ratio:1200/625; }
    .scene-label { position:absolute; top:26px; left:28px; font-size:9px; letter-spacing:.21em; line-height:1.8; color:#58766b; pointer-events:none; }
    .scene-label b { font-weight:600; }
    .scene-label span { color:#7e9386; font-size:9px; letter-spacing:.12em; }
    .weather { position:absolute; right:28px; top:27px; display:flex; align-items:center; gap:9px; color:#657c64; font-size:10px; letter-spacing:.08em; }
    .weather svg { width:19px; height:19px; }
    .controls { display:flex; align-items:center; justify-content:space-between; gap:22px; min-height:88px; padding:18px 27px; border-top:1px solid #d7ddcc; }
    .transport { display:flex; align-items:center; gap:13px; }
    .play { border:0; width:42px; height:42px; border-radius:50%; background:var(--green); color:#fffbea; display:grid; place-items:center; cursor:pointer; transition:background .2s,transform .2s; }
    .play:hover { background:#234f41; transform:scale(1.04); }
    .play svg { width:16px; height:16px; }
    .track-name { font-size:12px; font-weight:600; letter-spacing:.05em; margin-bottom:4px; }
    .track-sub { font-size:9px; color:var(--muted); letter-spacing:.1em; }
    .speed { display:flex; align-items:center; gap:13px; color:#718075; font-size:10px; letter-spacing:.04em; }
    input[type="range"] { width:115px; height:20px; accent-color:var(--green); cursor:pointer; }
    input[type="range"]::-webkit-slider-runnable-track { height:3px; border-radius:8px; background:#cbd7c6; }
    input[type="range"]::-webkit-slider-thumb { margin-top:-6px; }
    output { color:var(--ink); font-size:11px; min-width:30px; font-variant-numeric:tabular-nums; }
    .bell { border:1px solid #d2dccd; border-radius:50%; width:37px; height:37px; background:transparent; color:#53775d; display:grid; place-items:center; cursor:pointer; transition:background .2s,transform .2s; }
    .bell:hover { background:#edf1e5; transform:rotate(-9deg); }
    .bell svg { width:17px; height:17px; }
    .control-right { display:flex; align-items:center; gap:27px; }
    .footer { display:flex; justify-content:space-between; gap:20px; padding:18px 2px 0; color:#899486; font-size:9px; letter-spacing:.12em; line-height:1.8; }
    .footer span:last-child { letter-spacing:.04em; }
    .key { font-size:8px; border:1px solid #d7dece; border-radius:3px; padding:2px 5px; margin-right:5px; }
    button:focus-visible,input:focus-visible { outline:3px solid #d3a656; outline-offset:5px; }
    #bell-note { position:absolute; top:31%; left:68%; color:#3b725c; font-size:16px; font-weight:600; opacity:0; pointer-events:none; transform:translateY(8px) rotate(-9deg); }
    #bell-note.ring { animation:note-pop 1.25s ease-out both; }
    @keyframes note-pop { 0% { opacity:0; transform:translateY(10px) rotate(-9deg); } 20%,55% { opacity:1; } 100% { opacity:0; transform:translateY(-24px) rotate(2deg); } }
    @media (min-width:1500px) { .page { padding-top:44px; } }
    @media (max-width:700px) {
      .page { padding:21px 17px; } .masthead { padding-bottom:17px; } .brand-name { font-size:12px; } .edition { font-size:8px; } .edition span:last-child { display:none; }
      .intro { padding:27px 2px 23px; align-items:flex-start; } .eyebrow { font-size:9px; margin-bottom:10px; } h1 { font-size:26px; } .subtitle { font-size:11px; } .live { font-size:8px; padding-top:5px; } .live-text { display:none; }
      .scene-card { border-radius:14px; } .scene { aspect-ratio:1000/680; object-fit:cover; } .scene-label { top:17px; left:17px; font-size:8px; } .scene-label span { display:none; } .weather { top:18px; right:16px; font-size:9px; } .weather svg { width:16px; }
      .controls { padding:15px 16px; gap:13px; min-height:80px; } .transport { gap:9px; } .play { width:36px; height:36px; } .track-name { font-size:10px; } .track-sub { font-size:8px; } .speed { gap:7px; } .speed label { display:none; } input[type="range"] { width:68px; } .control-right { gap:12px; } .bell { width:32px; height:32px; } .footer { font-size:8px; padding-top:15px; } .footer span:last-child { display:none; }
    }
    @media (max-width:380px) { .speed { gap:4px; } input[type="range"] { width:50px; } .track-sub { letter-spacing:0; } .control-right { gap:8px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; } #bell-note.ring { animation:none; } }
  </style>
</head>

      <div class="brand">

    <section class="intro" aria-labelledby="page-title">
      <div><p class="eyebrow">TAKE THE SCENIC ROUTE</p><h1 id="page-title">慢一点，风景刚好。</h1><p class="subtitle">一只鹈鹕，一辆单车，一整个海风正好的下午。</p></div>

              <g id="motion-marks" stroke="#81967b" stroke-width="2.5" fill="none" opacity=".7"><path d="M435 305h39m-60 15h32m-11 15h18"/></g>
            </g>
            <g id="scenery-front"><g transform="translate(179 611) scale(1.1)"><use href="#grass"/></g><g transform="translate(1004 622) scale(1.3)"><use href="#grass"/></g><g transform="translate(1160 607) scale(.6)"><use href="#grass"/></g><path d="M65 595h21m213 16h13m631-13h20" stroke="#adb38b" stroke-width="3" stroke-linecap="round"/></g>
            <g fill="#8a9677" font-size="10" font-family="ui-monospace,monospace" letter-spacing="3"><text x="29" y="587">SLOW DAYS,</text><text x="29" y="604">HAPPY WHEELS.</text></g>
            <g transform="translate(1120 560)" stroke="#8d9a7d" fill="none" stroke-width="1.1"><circle r="21"/><path d="M0-17V17M-17 0H17"/><path d="m0-12-4 13L0-2 4 1Z" fill="#8d9a7d"/><text x="0" y="-27" text-anchor="middle" fill="#8d9a7d" stroke="none" font-size="8" font-family="sans-serif">N</text></g>
          </g>
        </svg>
        <div id="bell-note" aria-hidden="true">叮铃～ ♪</div>
      </div>
      <div class="controls">
        <div class="transport">
          <button class="play" id="play" type="button" aria-label="暂停动画" aria-pressed="false" title="暂停 / 播放（空格）"><svg id="play-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M5 3h3v14H5zm7 0h3v14h-3z"/></svg></button>
          <div><div class="track-name">沿着海岸，兜个风</div><div class="track-sub" id="track-status">ON A LITTLE SEASIDE RIDE</div></div>
        </div>
        <div class="control-right">
          <div class="speed"><label for="speed">骑行速度</label><input id="speed" type="range" min="0.5" max="2" step="0.25" value="1" aria-label="骑行速度"><output id="speed-value" for="speed">1×</output></div>
          <button class="bell" id="bell" type="button" aria-label="按响车铃" title="叮铃，借过一下"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 16h14l-2-4V9a5 5 0 0 0-10 0v3Zm5 4h4M12 2v2M3 7l-1 3m19-3 1 3"/></svg></button>
        </div>
      </div>
    </section>
    <footer class="footer"><span>没有目的地，也是一段好旅程。</span><span>100% SVG · 手绘好心情 &nbsp; / &nbsp; <span class="key">SPACE</span>暂停 / 播放</span></footer>
  </main>
  <script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      const nodes = Object.fromEntries(['rear-spokes','front-spokes','chainring','crank','near-leg','near-leg-outline','far-leg','far-leg-outline','near-foot','far-foot','rider-bike','pelican','scarf-tail','eye','blink','clouds','birds','road-lines','sea-texture','sailboat','buoy','scenery-back','scenery-front','distance-sign','bike-shadow','motion-marks'].map(id => [id,$(id)]));
      const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
      let playing = !motionQuery.matches;
      let speed = 1, time = 0, previous = null, frameId = null, audio = null;
      const TAU = Math.PI * 2;
      const wrap = (value, length) => ((value % length) + length) % length;
      const fmt = value => value.toFixed(2);
      function leg(side, phase) {
        const hip = side === 'near' ? {x:577,y:349} : {x:565,y:349};
        const foot = {x:600 + Math.cos(phase)*35, y:486 + Math.sin(phase)*35};
        const dx=foot.x-hip.x, dy=foot.y-hip.y, distance=Math.hypot(dx,dy);
        const upper=93, lower=91;
        const a=(upper*upper-lower*lower+distance*distance)/(2*distance);
        const h=Math.sqrt(Math.max(0,upper*upper-a*a));
        const knee={x:hip.x+a*dx/distance+h*dy/distance, y:hip.y+a*dy/distance-h*dx/distance};
        const path=`M${hip.x} ${hip.y} L${fmt(knee.x)} ${fmt(knee.y)} ${fmt(foot.x)} ${fmt(foot.y)}`;
        nodes[`${side}-leg`].setAttribute('d',path);
        nodes[`${side}-leg-outline`].setAttribute('d',path);
        nodes[`${side}-foot`].setAttribute('transform',`translate(${fmt(foot.x)} ${fmt(foot.y-5)}) rotate(-3)`);
        return foot;
      }
      function render(t) {
        const phase=t*TAU*.72-.6;
        const wheel=t*190;
        nodes['rear-spokes'].setAttribute('transform',`rotate(${fmt(wheel)})`);
        nodes['front-spokes'].setAttribute('transform',`rotate(${fmt(wheel)})`);
        nodes.chainring.setAttribute('transform',`translate(600 486) rotate(${fmt(phase*180/Math.PI)})`);
        const near=leg('near',phase), far=leg('far',phase+Math.PI);
        nodes.crank.setAttribute('d',`M${fmt(far.x)} ${fmt(far.y)} 600 486 ${fmt(near.x)} ${fmt(near.y)}`);
        const bob=Math.sin(phase*2)*1.25;
        nodes['rider-bike'].setAttribute('transform',`translate(0 ${fmt(bob)})`);
        nodes.pelican.setAttribute('transform',`rotate(${fmt(Math.sin(phase)*.45)} 577 349)`);
        nodes['scarf-tail'].setAttribute('transform',`rotate(${fmt(Math.sin(t*6)*3)} 643 229)`);
        const blink=wrap(t,5.4)>5.22;
        nodes.eye.setAttribute('opacity',blink?'0':'1'); nodes.blink.setAttribute('opacity',blink?'1':'0');
        nodes.clouds.setAttribute('transform',`translate(${fmt(-wrap(t*3,1250))} 0)`);
        nodes.birds.setAttribute('transform',`translate(${fmt(Math.sin(t*.22)*18)} ${fmt(Math.sin(t*1.5)*2)})`);
        nodes['road-lines'].setAttribute('transform',`translate(${fmt(-wrap(t*190,230))} 0)`);
        nodes['sea-texture'].setAttribute('transform',`translate(${fmt(-wrap(t*8,190))} 0)`);
        nodes.sailboat.setAttribute('transform',`translate(${fmt(232+Math.sin(t*.13)*38)} ${fmt(359+Math.sin(t*1.3)*1.6)})`);
        nodes.buoy.setAttribute('transform',`translate(1040 ${fmt(377+Math.sin(t*1.9)*2)}) rotate(${fmt(Math.sin(t*1.3)*3)})`);
        nodes['scenery-back'].setAttribute('transform',`translate(${fmt(-wrap(t*76,1400))} 0)`);
        nodes['scenery-front'].setAttribute('transform',`translate(${fmt(-wrap(t*190,1460))} 0)`);
        nodes['distance-sign'].setAttribute('transform',`translate(${fmt(1250-wrap(t*76+140,1440))} 369)`);
        nodes['bike-shadow'].setAttribute('rx',fmt(248+Math.sin(phase*2)*2));
        nodes['motion-marks'].setAttribute('opacity',fmt(.45+Math.sin(t*5)*.15));
      }
      function tick(stamp) {
        frameId=null;
        if (!playing || document.hidden) return;
        if (previous!==null) time+=Math.min((stamp-previous)/1000,.05)*speed;
        previous=stamp; render(time); frameId=requestAnimationFrame(tick);
      }
      function schedule() { if (playing && !document.hidden && frameId===null) { previous=null; frameId=requestAnimationFrame(tick); } }
      function setPlaying(value) {
        playing=value;
        if (frameId!==null) cancelAnimationFrame(frameId);
        frameId=null; previous=null;
        document.body.classList.toggle('paused',!playing);
        $('play').setAttribute('aria-label',playing?'暂停动画':'播放动画');
        $('play').setAttribute('aria-pressed',String(!playing));
        $('play-icon').innerHTML=playing?'<path d="M5 3h3v14H5zm7 0h3v14h-3z"/>':'<path d="m6 3 11 7-11 7z"/>';
        $('live-status').textContent=playing?'好天气，骑行中':'歇一会儿，看看海';
        $('track-status').textContent=playing?'ON A LITTLE SEASIDE RIDE':'TAKE A BREATH. ENJOY THE VIEW.';
        schedule();
      }
      $('play').addEventListener('click',()=>setPlaying(!playing));
      $('speed').addEventListener('input',event=>{ speed=Number(event.target.value); $('speed-value').textContent=`${speed}×`; });
      document.addEventListener('keydown',event=>{
        if (event.code==='Space' && !/^(INPUT|BUTTON|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) && !document.activeElement.isContentEditable) { event.preventDefault(); setPlaying(!playing); }
      });
      document.addEventListener('visibilitychange',()=>{
        if (document.hidden) { if(frameId!==null) cancelAnimationFrame(frameId); frameId=null; previous=null; }
        else schedule();
      });
      motionQuery.addEventListener('change',event=>{if(event.matches)setPlaying(false);});
      $('bell').addEventListener('click',async()=>{
        const note=$('bell-note'); note.classList.remove('ring'); void note.offsetWidth; note.classList.add('ring');
        try {
          const AudioContext=window.AudioContext||window.webkitAudioContext;
          if(!AudioContext) return;
          audio=audio||new AudioContext(); if(audio.state==='suspended') await audio.resume();
          for(const delay of [0,.16]) {
            const at=audio.currentTime+delay;
            for(const [frequency,volume] of [[1480,.08],[2230,.025],[2960,.012]]) {
              const oscillator=audio.createOscillator(), gain=audio.createGain();
              oscillator.type='sine'; oscillator.frequency.value=frequency;
              gain.gain.setValueAtTime(0,at); gain.gain.linearRampToValueAtTime(volume,at+.006); gain.gain.exponentialRampToValueAtTime(.0001,at+.65);
              oscillator.connect(gain); gain.connect(audio.destination); oscillator.start(at); oscillator.stop(at+.7);
            }
          }
        } catch (_) { /* The visual bell also works when audio is unavailable. */ }
      });
      render(0); setPlaying(playing);
    })();
  </script>
</body>
</html>
